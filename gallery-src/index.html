<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery · The Long Way Round</title>
  <meta name="description" content="A travel scrapbook by lulzx. Photographs, loose pages, and the long way round.">
  <meta name="theme-color" content="#493321">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%23718334'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

  <header class="site-header">
    <div class="container header-inner">

      <nav class="nav" aria-label="Main navigation"><a href="/">home</a><a href="/learn">writing</a><a href="/about">about</a><a href="/gallery/">gallery</a><a href="https://github.com/Lulzx" target="_blank" rel="noopener">github ↗</a><button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"></button></nav>
    </div>
  </header>

  <main>
  <div id="gallery"><div class="loading">Loading images&hellip;</div></div>

  </main>

  <script>
    // ----- theme (shares the main site's persisted preference) -----
    const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4 6.4 17.6M17.6 6.4 19.4 4.6"/></svg>';
    const MOON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>';
    const toggleBtn = document.getElementById('themeToggle');

    function applyTheme(dark) {
      document.documentElement.classList.toggle('dark', dark);
      toggleBtn.innerHTML = dark ? SUN : MOON;
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', dark ? '#2d241c' : '#493321');
    }

    let dark = false;
    try {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      dark = saved === 'dark' || (!saved && prefersDark);
    } catch (e) { }
    applyTheme(dark);

    toggleBtn.addEventListener('click', () => {
      dark = !dark;
      applyTheme(dark);
      try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) { }
    });
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
